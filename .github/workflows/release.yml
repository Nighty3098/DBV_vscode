name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and attach the VSIX
      id-token: write # Open VSX trusted publishing (OIDC)
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          node -e '
            const { version } = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (tag !== version) {
              console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${version}.`);
              process.exit(1);
            }
          '

      - name: Type-check
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Package VSIX
        run: npm run package -- --out dbv.vsix

      - name: Inspect package contents
        run: npx --yes @vscode/vsce ls --no-dependencies

      - name: Publish to Open VSX
        run: |
          if [ -n "${OVSX_PAT:-}" ]; then
            npx --yes ovsx publish dbv.vsix --pat "$OVSX_PAT" --skip-duplicate
          else
            npx --yes ovsx publish dbv.vsix --trusted-publishing --skip-duplicate
          fi

      - name: Name release asset
        run: mv dbv.vsix "dbv-${GITHUB_REF_NAME#v}.vsix"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="dbv-${GITHUB_REF_NAME#v}.vsix"
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "DBV $GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
