name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build extension
        run: npm run build

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --out dbv.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: dbv-vsix
          path: dbv.vsix
          if-no-files-found: error
